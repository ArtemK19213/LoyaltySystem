<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/css/site.css"/><script type="module" src="/js/nav.js"></script><title>Правила программы</title></head><body>
<main class="container"><section class="section"><h1>Генератор правил</h1>
<div class="small">Соберите документ с правилами: участники, регистрация, начисление/списание, сроки, исключения, возвраты, коммуникации, правовые ссылки.</div></section>
<section class="card section"><form id="rf" class="grid">
<label>Название программы<input id="nm" placeholder="Например: «Бонусная программа «Х»»"></label>
<label>Организация<input id="org" placeholder="ООО «Магазин»"></label>
<div class="grid two"><label>1 балл = ₽<input id="pv" type="number" step="0.01" value="1"></label><label>Макс. % оплаты баллами<input id="mx" type="number" step="1" value="30"></label></div>
<div class="grid three"><label>Срок жизни баллов, мес.<input id="ttl" type="number" step="1" value="12"></label>
<label>Грейс-период, дней<input id="gr" type="number" step="1" value="7"></label><label>Отложенная активация, дней<input id="ad" type="number" step="1" value="14"></label></div>
<div class="grid three"><label>Категории-исключения (CSV)<input id="ex" placeholder="Подарочные сертификаты"></label>
<label>Комбинирование со скидками<select id="stack"><option>Запрещено</option><option>Разрешено</option></select></label>
<label>Порядок списания<select id="spend"><option>FIFO</option><option>LIFO</option></select></label></div>
<div class="grid three"><label>Welcome-бонусы<input id="wel" type="number" step="1" value="100"></label>
<label>ДР множитель<input id="bmult" type="number" step="0.1" value="2"></label>
<label>Окно ДР ±дней<input id="bwin" type="number" step="1" value="7"></label></div>
<div class="grid two"><label>URL оферты<input id="offer" placeholder="https://пример.рф/offer"></label><label>URL политики ПДн<input id="priv" placeholder="https://пример.рф/privacy"></label></div>
<button class="btn primary" type="button" id="gen">Сгенерировать .md</button></form></section>
<section class="card section"><h3>Предпросмотр</h3><pre id="out" style="white-space:pre-wrap"></pre>
<div class="row"><button class="btn" id="dl">Скачать .md</button></div></section></main>
<div id="toast"></div><script type="module">import {downloadText} from '/js/common.js';
function build(){const name=nm.value||'Программа лояльности',orgName=org.value||'Организация';
const md=`# ${name}
**Организатор:** ${orgName}

## 1. Общие положения
1.1. Участником может стать дееспособное лицо, согласившееся с правилами и давшее согласие на обработку ПДн.  
1.2. Регистрация: сайт/приложение/офлайн/чат‑бот. Приветственные бонусы — ${wel.value} баллов.  
1.3. Организатор вправе изменять условия с уведомлением не позднее 10 дней и публикацией актуальной версии.

## 2. Начисление бонусов
2.1. Бонусы начисляются за покупки и действия (регистрация, отзывы, опросы, согласие на рассылки, реферал).  
2.2. Отложенная активация — ${ad.value} дней.  
2.3. День рождения: ×${bmult.value} в окне ±${bwin.value} дней.  
2.4. Начисления на уценённые и при оплате баллами — по условиям программы/акций.

## 3. Использование бонусов
3.1. 1 балл = ${pv.value} ₽. Максимум к оплате — ${mx.value}% (если не указано иное).  
3.2. Порядок списания: ${spend.value}. Шаг/минимум — согласно настройкам магазина.  
3.3. Совмещение со скидками/купонными акциями: ${stack.value.toLowerCase()} (если не указано иное).

## 4. Срок действия и сгорание
4.1. Срок жизни — ${ttl.value} месяцев от начисления (если иная политика не установлена).  
4.2. Льготный период перед сгоранием — ${gr.value} дней; направляются уведомления.

## 5. Ограничения
5.1. Не начисляются/не принимаются к оплате в категориях: ${ex.value or 'перечень указан на сайте'}.  
5.2. Бонусы не начисляются на доставку, подарочные сертификаты и иные позиции, если иное не предусмотрено акцией.  
5.3. Возвраты: бонусы могут быть пересчитаны/аннулированы пропорционально возврату.

## 6. Коммуникации
6.1. Уведомления: welcome, изменение баланса, повышение уровня, напоминания о сгорании. Каналы: email/SMS/мессенджеры.  
6.2. Клиент может отозвать согласие на рекламные сообщения без потери статуса участника.

## 7. Правовые аспекты
7.1. Обработка ПДн — согласно политике: <${priv.value}>.  
7.2. Условия программы — публичная оферта: <${offer.value}>.  
7.3. Применяются нормы законодательства о персональных данных, рекламе и защите прав потребителей.

## 8. Прочее
8.1. Программа действует онлайн и офлайн с объединённым учётом.  
8.2. Организатор вправе приостановить участие при злоупотреблениях (антифрод).`;
return md;}
gen.onclick=()=>{out.textContent=build();};dl.onclick=()=>downloadText('loyalty_rules.md', out.textContent||build());
</script></body></html>
