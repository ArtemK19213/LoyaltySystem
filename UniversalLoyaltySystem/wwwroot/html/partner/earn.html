
<!doctype html><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=device-width, initial-scale=1"/>
<link rel="stylesheet" href="/css/site.css"/><script type="module" src="/js/nav.js"></script><title>Начислить/Списать</title></head><body>
<main class="container"><section class="hero"><h1>Начислить / Списать</h1></section>
<div class="grid two">
<section class="surface"><h3>Начислить</h3>
<form id="ef" class="grid"><label><span>Карта / Email / Телефон / QR</span><input name="cardQuery" required></label>
<label><span>Сумма чека, ₽</span><input name="orderAmount" type="number" step="0.01" required></label>
<button class="btn primary">Начислить</button></form></section>
<section class="surface"><h3>Списать</h3>
<form id="rf" class="grid"><label><span>Карта / Email / Телефон / QR</span><input name="cardQuery" required></label>
<label><span>Баллы к списанию</span><input name="points" type="number" step="1" required></label>
<button class="btn primary">Списать</button></form></section>
</div></main><div id="toast"></div>
<script type="module">import {api,toast,ulid} from '/js/common.js';
ef.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(ef);
await api('/api/partner/earn',{method:'POST',body:JSON.stringify({cardQuery:fd.get('cardQuery'),orderAmount:Number(fd.get('orderAmount')),orderId:ulid()})});toast('Начислено');});
rf.addEventListener('submit',async e=>{e.preventDefault();const fd=new FormData(rf);
await api('/api/partner/redeem',{method:'POST',body:JSON.stringify({cardQuery:fd.get('cardQuery'),points:Number(fd.get('points')),orderId:ulid()})});toast('Списано');});</script></body></html>
