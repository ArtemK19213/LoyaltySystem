<!doctype html>
<html lang="ru">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="stylesheet" href="/css/site.css" />
    <script type="module" src="/js/nav.js"></script>
    <title>Выпуск карт</title>
</head>
<body>
    <main class="container">
        <section class="hero"><h1>Выпуск и поиск карт</h1></section>

        <div class="grid two">
            <section class="surface">
                <h3>Выпустить карту</h3>
                <div class="grid">
                    <label>
                        <span>Программа</span>
                        <select id="program"></select>
                    </label>
                    <label>
                        <span>Привязать к клиенту (необязательно: email или телефон)</span>
                        <input id="contact" placeholder="Можно оставить пустым — карта будет анонимной">
                    </label>
                    <button id="issue" class="btn primary">Выпустить</button>
                    <div id="issued" class="small"></div>
                </div>
            </section>

            <section class="surface">
                <h3>Поиск карт</h3>
                <div class="grid two">
                    <input id="q" placeholder="Номер, email, телефон или QR-токен">
                    <button id="find" class="btn">Искать</button>
                </div>
                <div id="res" style="margin-top:12px"></div>
            </section>
        </div>
    </main>
    <div id="toast"></div>
    <script type="module" src="/js/partner/cards.js"></script>
</body>
</html>
